name: StickS3 Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sticks3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static board/config/docs validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate board map
        run: python3 tools/check_board_map.py

      - name: Validate transport config
        run: python3 tools/check_transport_config.py

      - name: Validate factory image tool
        run: python3 tests/tools/test_make_factory_image.py

      - name: Validate partition table
        run: python3 tools/check_partition_table.py

      - name: Validate LCD keyboard casing
        run: python3 tests/tools/test_status_ui_keyboard.py

      - name: Validate docs consistency
        run: python3 tools/check_docs_consistency.py

      - name: Validate naming consistency
        run: python3 tools/check_naming_consistency.py

      - name: Validate audio clocks and safety
        run: |
          python3 tools/check_audio_clock.py
          python3 tools/check_audio_safety.py

      - name: Validate source inventories
        run: |
          python3 tools/check_source_inventory.py
          python3 tools/check_uac_source_inventory.py

      - name: Validate Web UI asset budget
        run: python3 tools/check_web_ui_budget.py

  host-unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run host tests
        run: tests/host/run_host_tests.sh

  esp-idf-build:
    name: Build StickS3 local automation firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware and 0x0 factory image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: |
            idf.py set-target esp32s3
            idf.py build
            python3 tools/make_factory_image.py
            test -s build/m5sticks3_local_automation.bin
            test -s build/m5sticks3_local_automation_app.bin
            sha256sum build/m5sticks3_local_automation.bin > build/m5sticks3_local_automation.bin.sha256
            sha256sum build/m5sticks3_local_automation_app.bin > build/m5sticks3_local_automation_app.bin.sha256
            cat > build/FLASH_THIS_FACTORY_IMAGE.txt <<'EOF'
            Flash m5sticks3_local_automation.bin at offset 0x0.

            Example:
              esptool.py --chip esp32s3 --port <PORT> erase_flash
              esptool.py --chip esp32s3 --port <PORT> write_flash 0x0 m5sticks3_local_automation.bin

            m5sticks3_local_automation_app.bin is included for diagnostics/advanced ESP-IDF workflows only.
            Do not flash any *_app.bin file at 0x0; that is an application-partition image only.
            EOF
            python3 - <<'PY'
            from pathlib import Path
            factory = Path("build/m5sticks3_local_automation.bin")
            app = Path("build/m5sticks3_local_automation_app.bin")
            if factory.stat().st_size <= app.stat().st_size:
                raise SystemExit(
                    f"factory image {factory} ({factory.stat().st_size} bytes) "
                    f"is not larger than app image {app} ({app.stat().st_size} bytes)"
                )
            print(f"factory image bytes: {factory.stat().st_size}")
            print(f"app image bytes: {app.stat().st_size}")
            PY

      - name: Compile experimental UAC variants
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: |
            make_uac_defaults() {
              variant="$1"
              cp config/sdkconfig.defaults "/tmp/sdkconfig.uac-${variant}.defaults"
              sed -i 's/CONFIG_APP_USB_UAC_DEVICE=n/CONFIG_APP_USB_UAC_DEVICE=y/' "/tmp/sdkconfig.uac-${variant}.defaults"
              case "${variant}" in
                mic)
                  printf '\nCONFIG_APP_USB_UAC_MIC=y\nCONFIG_APP_USB_UAC_SPEAKER=n\n' >> "/tmp/sdkconfig.uac-${variant}.defaults"
                  ;;
                speaker)
                  printf '\nCONFIG_APP_USB_UAC_MIC=n\nCONFIG_APP_USB_UAC_SPEAKER=y\n' >> "/tmp/sdkconfig.uac-${variant}.defaults"
                  ;;
              esac
            }

            make_uac_defaults mic
            idf.py -B build-uac-mic -D SDKCONFIG_DEFAULTS=/tmp/sdkconfig.uac-mic.defaults set-target esp32s3
            idf.py -B build-uac-mic -D SDKCONFIG_DEFAULTS=/tmp/sdkconfig.uac-mic.defaults build

            make_uac_defaults speaker
            idf.py -B build-uac-speaker -D SDKCONFIG_DEFAULTS=/tmp/sdkconfig.uac-speaker.defaults set-target esp32s3
            idf.py -B build-uac-speaker -D SDKCONFIG_DEFAULTS=/tmp/sdkconfig.uac-speaker.defaults build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: sticks3-local-automation-build
          path: |
            build/m5sticks3_local_automation.bin
            build/m5sticks3_local_automation.bin.sha256
            build/m5sticks3_local_automation_app.bin
            build/m5sticks3_local_automation_app.bin.sha256
            build/FLASH_THIS_FACTORY_IMAGE.txt
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/bootloader/*.bin
            build/partition_table/*.bin
          if-no-files-found: error
          retention-days: 14
